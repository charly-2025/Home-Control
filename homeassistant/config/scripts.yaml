chambre_toggle:
  alias: Chambre - Toggle
  sequence:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: light.lampe_bureau
          state: 'on'
        - condition: state
          entity_id: switch.lampe_chevet
          state: 'on'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.lampe_bureau
      - action: switch.turn_off
        target:
          entity_id: switch.lampe_chevet
    default:
    - action: light.turn_on
      target:
        entity_id: light.lampe_bureau
    - action: switch.turn_on
      target:
        entity_id: switch.lampe_chevet
  mode: single
