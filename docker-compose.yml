services:

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: home-control-homeassistant
    restart: unless-stopped
    depends_on:
      - mqtt
      - zigbee
    volumes:
      - ./homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8123:8123"
    networks:
      - home_control_network

  mqtt:
    image: eclipse-mosquitto:2
    container_name: home-control-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/config:/mosquitto/config
      - ./mqtt/data:/mosquitto/data
      - ./mqtt/log:/mosquitto/log
    networks:
      - home_control_network

  zigbee:
    image: koenkk/zigbee2mqtt
    container_name: home-control-zigbee
    restart: unless-stopped
    depends_on:
      - mqtt
    ports:
      - "8080:8080"
    volumes:
      - ./zigbee/data:/app/data
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    networks:
      - home_control_network
  mysql:
    image: mysql:8.4
    container_name: home-control-mysql
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
    
    networks:
      - home_control_network

  backend:
    build: ./backend
    container_name: home-control-backend
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./backend:/app

    depends_on:
      - mqtt
      - mysql

    networks:
      - home_control_network

  frontend:
    build: ./frontend
    container_name: home-control-frontend
    restart: unless-stopped

    volumes:
      - ./frontend:/app
      - /app/node_modules

    command: npm run dev -- --host

    networks:
      - home_control_network

  nginx:
    build: ./nginx
    container_name: home-control-nginx
    restart: unless-stopped

    depends_on:
      - frontend
      - backend

    ports:
      - "80:80"

    networks:
      - home_control_network

volumes:
  mysql_data:

networks:
  home_control_network:
    driver: bridge