# Zigbee2MQTT configuration template.
# First setup: cp zigbee/configuration.example.yaml zigbee/data/configuration.yaml
# Zigbee2MQTT generates the network keys on first start, inside zigbee/data/,
# which is ignored by git: they never end up in the repository.
homeassistant:
  enabled: true
mqtt:
  server: mqtt://mqtt:1883
serial:
  port: /dev/ttyUSB0
  adapter: zstack
frontend:
  enabled: true
advanced:
  network_key: GENERATE
  pan_id: GENERATE
  ext_pan_id: GENERATE
device_options: {}
devices: {}
groups: {}
version: 5
